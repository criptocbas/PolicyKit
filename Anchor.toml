[toolchain]
anchor_version = "0.32.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
policykit = "AoTJDX2z2ej5r4UUKCofEbgDUXApWpGhQnvfk8seZf27"

[programs.devnet]
policykit = "AoTJDX2z2ej5r4UUKCofEbgDUXApWpGhQnvfk8seZf27"

[registry]
url = "https://api.apr.dev"

[provider]
# Use localnet for `anchor test` (spins up a local validator). Deploy to
# devnet/mainnet with: anchor deploy --provider.cluster devnet
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
